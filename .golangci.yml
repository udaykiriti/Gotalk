run:
  # Specify the go version to use when analyzing.
  # This avoids issues if go.mod targets a newer version than the linter supports.
  go: '1.24'

linters:
  enable:
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errcheck

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
