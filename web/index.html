<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTalk Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="brand">GoTalk</div>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" value="Guest">
                <input type="text" id="room" value="general" placeholder="Room">
            </div>

            <div class="actions">
                <button id="mobile-users-btn" onclick="toggleUserList()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                </button>
                <button id="inviteBtn" onclick="showInviteQR()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                    Invite
                </button>
                <button id="connectBtn" onclick="handleConnectClick()">Connect</button>
                <button id="disconnectBtn" onclick="handleDisconnectClick()" class="hidden">Disconnect</button>
            </div>

            <div class="status-badge">
                <span class="status-dot disconnected"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div id="log">
                <div class="notification">Welcome! Enter your details above to join.</div>
            </div>
            
            <div id="user-list">
                <h3>Online</h3>
                <div id="users-content"></div>
            </div>
        </div>

        <!-- Footer -->
        <form id="form" class="footer">
            <input type="text" id="msg" autocomplete="off" placeholder="Type a message..." disabled>
            <button type="submit" id="sendBtn" disabled>Send</button>
        </form>
    </div>

    <!-- QR Modal -->
    <div id="qrModal" class="modal-overlay" onclick="hideInviteQR()">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="hideInviteQR()">&times;</button>
            <h2>Join this room</h2>
            <canvas id="qrCanvas"></canvas>
            <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">Scan to join room "<strong id="qrRoomName"></strong>"</div>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="/static/js/app.js"></script>
</body>

</html>
