name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        if: runner.os == 'Linux'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        if: runner.os == 'Linux'
        run: govulncheck ./...

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Smoke test
        if: runner.os == 'Linux'
        run: go run scripts/smoke_e2e.go
