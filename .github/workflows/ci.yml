name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Workaround Go version mismatch
        # golangci-lint (built with 1.24) cannot parse go.mod with 1.25.0
        # We temporarily change it to 1.24.0 just for the CI run.
        run: sed -i 's/go 1.25.0/go 1.24.0/' go.mod

      - name: Go format check
        if: runner.os == 'Linux'
        run: |
          FORMAT_DIFF=$(gofmt -d .)
          if [ -n "$FORMAT_DIFF" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            echo ""
            echo "Differences:"
            echo "$FORMAT_DIFF"
            exit 1
          fi

      - name: Golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Install govulncheck
        if: runner.os == 'Linux'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        if: runner.os == 'Linux'
        run: govulncheck ./...

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Smoke test
        if: runner.os == 'Linux'
        run: go run scripts/smoke_e2e.go
